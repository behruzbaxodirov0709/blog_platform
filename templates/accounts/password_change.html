{% extends "base.html" %}

{% block title %}Parolni o‘zgartirish · DevBlog{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="eyebrow">Security</div>
    <h1>Parolni o‘zgartirish</h1>
    <p class="muted">Xavfsizlik uchun eski parolingizni tasdiqlang.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit">🔐 Parolni saqlash</button>
            <a class="btn btn-secondary" href="{% url 'profile' %}">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
