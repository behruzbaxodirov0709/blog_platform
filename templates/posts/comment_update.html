{% extends "base.html" %}

{% block title %}Commentni tahrirlash · DevBlog{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="eyebrow">Comment</div>
    <h1>Commentni tahrirlash</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit">💾 Saqlash</button>
            <a class="btn btn-secondary" href="{% url 'post_detail' comment.post.pk %}">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
