{% extends "base.html" %}

{% block title %}Postni o‘chirish · DevBlog{% endblock %}

{% block content %}
<div class="card danger-box">
    <div class="eyebrow">Tasdiqlash</div>
    <h1>Postni o‘chirish</h1>
    <p>
        Rostdan ham <strong>“{{ post.title }}”</strong> postini o‘chirmoqchimisiz?
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="btn-danger" type="submit">🗑 Ha, o‘chirish</button>
            <a class="btn btn-secondary" href="{% url 'post_detail' post.pk %}">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}
