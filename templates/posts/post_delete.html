{% extends "base.html" %}

{% block title %}
    Postni o‘chirish
{% endblock %}

{% block content %}

    <h3>
        Rostdan ham "{{ post.title }}" postini o‘chirmoqchimisiz?
    </h3>

    <form method="post">
        {% csrf_token %}
        <button type="submit">O‘chirish</button>
    </form>

    <br>

    <a href="{% url 'post_detail' post.pk %}">
        Bekor qilish
    </a>

{% endblock %}
